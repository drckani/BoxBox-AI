name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The engine's failures used to surface at import time, so this catches a
      # broken dataset path or a missing runtime dependency before any test runs.
      - name: Smoke-import the app modules
        run: python -c "import data_loader, strategy_engine, gemini_engine"

      - name: Run the tests
        run: pytest tests/ -v
